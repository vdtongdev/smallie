# Builds the agent server image (Dockerfile.agent) once; every agent's Cloud Run service runs it
# (DEPLOYING.md, agent servers). Run from the project folder:
#   gcloud builds submit --config cloudbuild.agent.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.agent", "-t", "asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/smallie-agent", "."]
images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/smallie-agent
