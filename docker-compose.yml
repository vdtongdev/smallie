services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smallie-db
    environment:
      POSTGRES_USER: smallie
      POSTGRES_PASSWORD: smallie
      POSTGRES_DB: smallie
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallie -d smallie"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
